spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Hikari CP (Database Connection Pool) Optimizations for Low Memory Footprint
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

JWT_SECRET=ThisIsMyVeryLongSecretKeyForJwtAuthentication1234567890
JWT_EXPIRATION=2592000000

payment.dev-mode=true

phonepe.merchant.id=${PHONEPE_MERCHANT_ID:PGTESTPAYUAT86}
phonepe.salt.key=${PHONEPE_SALT_KEY:96434309-7796-489d-8924-ab56988a6076}
phonepe.salt.index=${PHONEPE_SALT_INDEX:1}
phonepe.api.url=${PHONEPE_API_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}

# Respect reverse proxy headers (Railway HTTPS Routing)
server.forward-headers-strategy=framework

logging.level.org.springframework.core.env=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG

admin.phone=${ADMIN_PHONE:}
admin.password=${ADMIN_PASSWORD:}
admin.full-name=${ADMIN_FULL_NAME:}